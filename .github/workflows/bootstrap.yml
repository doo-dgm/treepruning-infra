name: Bootstrap servidor (1 vez por VM nueva)

# Ejecutar UNA SOLA VEZ en cada VM nueva.
# Provisiona dependencias (Docker, Infisical CLI) y planta las credenciales
# de Infisical en ~/.bashrc del servidor. Despues de esto, deploy.yml
# funciona sin necesidad de secretos de Infisical en GitHub.
#
# Secrets de GitHub requeridos para este workflow:
#   AZURE_HOST                 - IP publica de la VM
#   AZURE_USER                 - Usuario SSH (treepruning)
#   AZURE_SSH_KEY              - Contenido del archivo .pem
#   INFISICAL_CLIENT_ID        - Machine Identity (Universal Auth)
#   INFISICAL_CLIENT_SECRET    - Machine Identity (Universal Auth)
#   INFISICAL_PROJECT_ID       - workspaceId de Infisical

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribir 'BOOTSTRAP' para confirmar (accion destructiva en la VM)"
        required: true
        type: string

env:
  REPO_DIR: /home/${{ secrets.AZURE_USER }}/tree-pruning

jobs:
  bootstrap:
    name: Provisionar VM desde cero
    runs-on: ubuntu-latest

    steps:
      - name: Verificar confirmacion
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "BOOTSTRAP" ]]; then
            echo "[ERROR] Debes escribir 'BOOTSTRAP' (exacto) para confirmar"
            exit 1
          fi
          echo "[OK] Confirmacion valida"

      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Validar secrets de GitHub
        run: |
          MISSING=()
          [[ -z "${{ secrets.AZURE_HOST }}" ]] && MISSING+=("AZURE_HOST")
          [[ -z "${{ secrets.AZURE_USER }}" ]] && MISSING+=("AZURE_USER")
          [[ -z "${{ secrets.AZURE_SSH_KEY }}" ]] && MISSING+=("AZURE_SSH_KEY")
          [[ -z "${{ secrets.INFISICAL_CLIENT_ID }}" ]] && MISSING+=("INFISICAL_CLIENT_ID")
          [[ -z "${{ secrets.INFISICAL_CLIENT_SECRET }}" ]] && MISSING+=("INFISICAL_CLIENT_SECRET")
          [[ -z "${{ secrets.INFISICAL_PROJECT_ID }}" ]] && MISSING+=("INFISICAL_PROJECT_ID")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "[ERROR] Faltan secrets en GitHub: ${MISSING[@]}"
            echo "Configurar en: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "[OK] Todos los secrets configurados"

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.AZURE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sincronizar repo al servidor
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }} \
            "mkdir -p ${{ env.REPO_DIR }}"

          rsync -avz \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'strapi-app/' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }}:${{ env.REPO_DIR }}/

      - name: Permisos de scripts
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }} \
            "chmod +x ${{ env.REPO_DIR }}/scripts/*.sh \
             && chmod +x ${{ env.REPO_DIR }}/docker/postgres/init-multiple-dbs.sh \
             && chmod +x ${{ env.REPO_DIR }}/docker/mysql/init-multiple-dbs.sh"

      - name: Ejecutar bootstrap.sh en la VM
        # Inyecta las credenciales de Infisical solo durante ESTE step.
        # El script las persiste en ~/.bashrc del servidor.
        # Proximos workflows (deploy.yml, update-service.yml) las leen del bashrc.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }} \
            "INFISICAL_CLIENT_ID='${{ secrets.INFISICAL_CLIENT_ID }}' \
             INFISICAL_CLIENT_SECRET='${{ secrets.INFISICAL_CLIENT_SECRET }}' \
             INFISICAL_PROJECT_ID='${{ secrets.INFISICAL_PROJECT_ID }}' \
             bash ${{ env.REPO_DIR }}/scripts/bootstrap.sh"

      - name: Setup Strapi (si no existe)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }} << 'ENDSSH'
            set -a; source ~/.bashrc; set +a
            if [ ! -d "$TP_REPO_DIR/strapi-app" ] || \
               [ ! -f "$TP_REPO_DIR/strapi-app/package.json" ]; then
              echo "[SETUP] Creando proyecto Strapi..."
              bash $TP_REPO_DIR/scripts/setup-strapi.sh
            else
              echo "[OK] strapi-app/ ya existe"
            fi
          ENDSSH

      - name: Bootstrap completado
        if: success()
        run: |
          echo "### Bootstrap exitoso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "La VM esta provisionada y lista. Las credenciales de Infisical" >> $GITHUB_STEP_SUMMARY
          echo "viven ahora en \`~/.bashrc\` del servidor." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Siguientes pasos:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Ejecutar el workflow \`Deploy Tree Pruning\` (action: \`deploy\`)" >> $GITHUB_STEP_SUMMARY
          echo "   para levantar los contenedores." >> $GITHUB_STEP_SUMMARY
          echo "2. Si Kong falla con error de auth en pg_hba, ejecutar el deploy" >> $GITHUB_STEP_SUMMARY
          echo "   con action: \`fix-kong\` una sola vez." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A partir de aqui, \`deploy.yml\` no requiere los secrets de" >> $GITHUB_STEP_SUMMARY
          echo "Infisical en GitHub -- solo \`AZURE_HOST\`, \`AZURE_USER\` y \`AZURE_SSH_KEY\`." >> $GITHUB_STEP_SUMMARY

      - name: Bootstrap fallo
        if: failure()
        run: |
          echo "### Bootstrap fallo" >> $GITHUB_STEP_SUMMARY
          echo "Revisar los logs del step que fallo y reintentar." >> $GITHUB_STEP_SUMMARY
