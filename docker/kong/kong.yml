# docker/kong/kong.yml
_format_version: "3.0"
_transform: true

services:
  # ── Producción ─────────────────────────────────────
  - name: treepruning-backend
    host: tp-backend
    protocol: http
    port: 8080
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    retries: 5
    routes:
      - name: treepruning-prod-route
        hosts:
          - api.treepruning.org
        paths:
          - /api/v1
        strip_path: false
        protocols:
          - http
          - https
    plugins:
      - name: cors
        config:
          origins:
            - https://treepruning.org
            - https://www.treepruning.org
            - https://dev.treepruning.org
            - https://www.dev.treepruning.org
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
          exposed_headers:
            - Authorization
          credentials: true
          max_age: 3600

  # ── Desarrollo ─────────────────────────────────────
  - name: treepruning-backend-dev
    host: tp-backend-dev
    protocol: http
    port: 8080
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    retries: 5
    routes:
      - name: treepruning-dev-route
        hosts:
          - api-dev.treepruning.org
        paths:
          - /api/v1
        strip_path: false
        protocols:
          - http
          - https
      # Swagger UI -- solo expuesto en dev (no en prod) para facilitar
      # la exploracion durante demos y sustentacion. El JSON de OpenAPI
      # se sirve bajo /api/v1/openapi (ya cubierto por la ruta principal)
      # para evitar el bloqueo de Cloudflare WAF al path canonico /v3/api-docs.
      - name: treepruning-dev-swagger-ui
        hosts:
          - api-dev.treepruning.org
        paths:
          - /swagger-ui
          - /swagger-ui.html
        strip_path: false
        protocols:
          - http
          - https
    plugins:
      - name: cors
        config:
          origins:
            - https://treepruning.org
            - https://www.treepruning.org
            - https://dev.treepruning.org
            - https://www.dev.treepruning.org
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
          exposed_headers:
            - Authorization
          credentials: true
          max_age: 3600