services:

  # --------------------------------------------
  # POSTGRESQL -- un solo contenedor, varias DBs
  # WAL level=logical requerido por Debezium CDC
  # --------------------------------------------
  pg1:
    image: postgres:16
    container_name: pg1
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    # wal_level=logical: habilita replicación lógica (necesario para Debezium).
    # max_wal_senders / max_replication_slots: valores mínimos para 1 conector.
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=8
      -c max_replication_slots=8
    volumes:
      - pg1_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    networks:
      - treepruning-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------
  # MYSQL 8 -- fallback de PostgreSQL (pg1)
  # El backend lo activa automáticamente si pg1
  # no responde al arrancar (DataSourceFallback).
  # Debezium JDBC Sink mantiene los datos sincronizados
  # en caliente vía CDC (replicación continua desde pg1).
  # MYSQL_DATABASE crea la BD treepruning; el init script
  # crea adicionalmente keycloak y strapi.
  # --------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: tp-mysql
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh
      - ./docker/mysql/init-treepruning-extra.sql:/docker-entrypoint-initdb.d/02-init-treepruning-extra.sql
    networks:
      - treepruning-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------
  # REDIS -- cache + sessions
  # --------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tp-redis
    restart: unless-stopped
    # maxmemory en redis es para su propio cache; mem_limit del container es
    # el techo total (incluye overhead y conexiones), por eso 768m > 512m.
    mem_limit: 768m
    mem_reservation: 256m
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - treepruning-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------
  # REDPANDA -- Message broker Kafka-compatible
  # Usado por Debezium para publicar eventos CDC
  # --------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v23.3.21
    container_name: tp-redpanda
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      # PLAINTEXT: comunicación interna entre containers (tp-redpanda:29092)
      # OUTSIDE: acceso desde el host vía túnel SSH (localhost:9092)
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://tp-redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - treepruning-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------
  # DEBEZIUM -- Change Data Capture (CDC)
  # Captura cambios en PostgreSQL y los publica
  # como eventos en Redpanda (Kafka-compatible).
  # El conector se registra vía POST a :8083
  # después del primer arranque.
  # --------------------------------------------
  debezium:
    build:
      context: ./docker/debezium
      dockerfile: Dockerfile
    image: tp-debezium:2.7
    container_name: tp-debezium
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      BOOTSTRAP_SERVERS: tp-redpanda:29092
      GROUP_ID: debezium-group
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      # factor=1 porque Redpanda corre en modo single-node
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    ports:
      - "8083:8083"
    networks:
      - treepruning-net
    depends_on:
      redpanda:
        condition: service_healthy
      pg1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------
  # KEYCLOAK -- IAM
  # --------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tp-keycloak
    # Keycloak (Quarkus + JVM) tiene un cold-start memory spike alto;
    # con 1.5GB era OOM-killed (exit 137). 2GB le da margen.
    mem_limit: 2g
    mem_reservation: 1g
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.treepruning.org`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=cloudflare"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME: auth.treepruning.org
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      # Failover: entrypoint.sh sondea pg1 y elige PostgreSQL o MySQL
      POSTGRES_HOST: pg1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MYSQL_HOST: tp-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # El entrypoint elige la BD; no se pasa command (start-dev está hardcodeado en el script)
    entrypoint: ["/bin/bash", "/opt/keycloak-entrypoint.sh"]
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/entrypoint.sh:/opt/keycloak-entrypoint.sh:ro
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_started   # service_started: arranca aunque pg1 esté caído
      mysql:
        condition: service_healthy   # MySQL siempre disponible como fallback
    healthcheck:
      # bash /dev/tcp: built-in, no depende de curl ni wget.
      # Verifica que el puerto 8080 acepta conexiones TCP.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --------------------------------------------
  # KONG -- API Gateway (DB-less / declarativo)
  # Rutas definidas en docker/kong/kong.yml
  # --------------------------------------------
  kong:
    image: kong:3.7-ubuntu
    container_name: tp-kong
    mem_limit: 3g
    mem_reservation: 1g
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.kong-svc.loadbalancer.server.port=8000"
      - "traefik.http.routers.kong-prod.rule=Host(`api.treepruning.org`)"
      - "traefik.http.routers.kong-prod.entrypoints=websecure"
      - "traefik.http.routers.kong-prod.tls.certresolver=cloudflare"
      - "traefik.http.routers.kong-prod.priority=100"
      - "traefik.http.routers.kong-dev.rule=Host(`api-dev.treepruning.org`)"
      - "traefik.http.routers.kong-dev.entrypoints=websecure"
      - "traefik.http.routers.kong-dev.tls.certresolver=cloudflare"
      - "traefik.http.routers.kong-dev.priority=100"
      - "traefik.http.routers.kong-prod.service=kong-svc"
      - "traefik.http.routers.kong-dev.service=kong-svc"
    restart: unless-stopped
    environment:
      KONG_DATABASE:           "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG:   /dev/stdout
      KONG_ADMIN_ACCESS_LOG:   /dev/stdout
      KONG_PROXY_ERROR_LOG:    /dev/stderr
      KONG_ADMIN_ERROR_LOG:    /dev/stderr
      KONG_ADMIN_LISTEN:       "127.0.0.1:8001"
    volumes:
      - ./docker/kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
    networks:
      - treepruning-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------
  # MINIO -- Object storage S3-compatible
  # --------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: tp-minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`s3.treepruning.org`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=cloudflare"
      - "traefik.http.routers.minio.service=minio-svc"
      - "traefik.http.services.minio-svc.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`console.treepruning.org`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=cloudflare"
      - "traefik.http.routers.minio-console.service=minio-console-svc"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - treepruning-net
    mem_limit: 1g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------
  # SPRING CLOUD CONFIG SERVER
  # --------------------------------------------
  config-server:
    # Antes: 3.1.1-jre17 (Spring Boot 2.6.3, Java 17.0.2). Tenia un bug del JDK
    # con cgroup v2 (NullPointerException en CgroupInfo.getMountPoint()) que
    # rompia la inicializacion del MBeanServer al crearse TomcatMetricsBinder.
    # 5.0.0 trae Spring Boot 3.x + JDK actualizado donde el bug esta arreglado.
    image: hyness/spring-cloud-config-server:5.0.0
    container_name: tp-config-server
    # El buildpack de Paketo (BellSoft Liberica) tiene un memory-calculator
    # que con defaults exige ~660MB. Limit=768m + thread count reducido
    # mantienen el footprint manejable para un servicio read-only.
    mem_limit: 768m
    mem_reservation: 384m
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:///config
      SPRING_PROFILES_ACTIVE: native
      BPL_JVM_THREAD_COUNT: "50"
      BPL_JVM_HEAD_ROOM: "0"
    ports:
      - "8888:8888"
    volumes:
      - ./docker/config-repo:/config
    networks:
      - treepruning-net

  # --------------------------------------------
  # STRAPI -- CMS / Catálogo de parámetros
  # --------------------------------------------
  strapi:
    image: node:20-alpine
    container_name: tp-strapi
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.strapi.rule=Host(`cms.treepruning.org`)"
      - "traefik.http.routers.strapi.entrypoints=websecure"
      - "traefik.http.routers.strapi.tls.certresolver=cloudflare"
      - "traefik.http.services.strapi.loadbalancer.server.port=1337"
    restart: unless-stopped
    working_dir: /app
    environment:
      # Failover: entrypoint.sh sondea pg1 y elige PostgreSQL o MySQL
      DATABASE_NAME: strapi
      POSTGRES_HOST: pg1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MYSQL_HOST: tp-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      APP_KEYS: ${STRAPI_APP_KEYS}
      NODE_ENV: development
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
      - "1337:1337"
    volumes:
      - ./strapi-app:/app
      - ./docker/strapi/entrypoint.sh:/entrypoint.sh:ro
    command: sh /entrypoint.sh
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_started   # service_started: arranca aunque pg1 esté caído
      mysql:
        condition: service_healthy   # MySQL siempre disponible como fallback
    mem_limit: 2g
    mem_reservation: 1g
    healthcheck:
      # busybox wget viene en node:20-alpine; /_health responde 204 No Content
      # sin auth. Usamos 127.0.0.1 explicito porque Strapi 5 solo escucha en
      # IPv4 (0.0.0.0:1337) y "localhost" resuelve a ::1 (IPv6) en alpine.
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://127.0.0.1:1337/_health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # --------------------------------------------
  # LOKI -- agregación de logs
  # --------------------------------------------
  loki:
    image: grafana/loki:2.9.0
    container_name: tp-loki
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      # Override del config para subir ingestion_rate_mb (default 4 MB/s
      # genera HTTP 429 con el volumen de logs de 17 containers).
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - treepruning-net
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --------------------------------------------
  # PROMTAIL -- recolector de logs Docker
  # --------------------------------------------
  promtail:
    image: grafana/promtail:2.9.0
    container_name: tp-promtail
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./docker/promtail/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - treepruning-net
    depends_on:
      - loki

  # --------------------------------------------
  # PROMETHEUS -- metrics
  # --------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: tp-prometheus
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - treepruning-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://localhost:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------
  # GRAFANA -- dashboards (métricas + logs)
  # --------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: tp-grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.treepruning.org`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - treepruning-net
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health | grep -q '\"database\": \"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------
  # SONARQUBE -- code quality
  # --------------------------------------------
  sonarqube:
    image: sonarqube:26.5.0.122743-community
    container_name: tp-sonarqube
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonar.treepruning.org`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.routers.sonarqube.tls.certresolver=cloudflare"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
      # sonar ocupa el puerto 9000 internamente, pero MinIO ya usa 9000:9000
      # en el host. El mapeo 9010:9000 evita el conflicto.
    restart: unless-stopped
    # SonarQube es pesado (Elasticsearch embedded + Java app). 3g cap deja
    # margen; ya consume ~2g en idle.
    mem_limit: 3g
    mem_reservation: 1500m
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://pg1:5432/sonarqube
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "9010:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # SonarQube tarda 1-2 min en arrancar (Elasticsearch). start_period
      # generoso evita marcarlo unhealthy durante el warm-up.
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -qE '\"status\":\"(UP|DB_MIGRATION_NEEDED)\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # --------------------------------------------
  # TRAEFIK -- Reverse Proxy + SSL (Let's Encrypt)
  # --------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: tp-traefik
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/letsencrypt:/letsencrypt
    networks:
      - treepruning-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.treepruning.org`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=cloudflare"
      - "traefik.http.routers.dashboard.service=api@internal"

  # --------------------------------------------
  # BACKEND -- Spring Boot (Producción)
  # Sin labels Traefik: acceso interno vía Kong
  # --------------------------------------------
  backend:
    image: ghcr.io/${GHCR_OWNER}/tree-pruning-backend:latest
    container_name: tp-backend
    restart: unless-stopped
    mem_limit: 1500m
    mem_reservation: 768m
    environment:
      POSTGRES_HOST: pg1
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
      JPA_FORMAT_SQL: "false"
      JPA_SCHEMA: public
      SERVER_PORT: 8080
      STORAGE_MINIO_ENDPOINT: http://tp-minio:9000
      STORAGE_MINIO_PUBLIC_ENDPOINT: https://s3.treepruning.org
      STORAGE_MINIO_BUCKET: ${STORAGE_MINIO_BUCKET}
      STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      VITE_KEYCLOAK_CLIENT: ${VITE_KEYCLOAK_CLIENT}
      STORAGE_MINIO_PRESIGNED_EXPIRY: "900"
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      STRAPI_URL: http://tp-strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      REDIS_HOST: tp-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      # Kafka/Redpanda para listener de invalidación de caché CDC
      KAFKA_BOOTSTRAP_SERVERS: tp-redpanda:29092
      # MySQL — fallback automático si pg1 no está disponible al arrancar
      MYSQL_HOST: tp-mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Firebase / FCM — JSON completo del service-account como string
      # Obtenerlo en: Firebase Console → Configuración del proyecto → Cuentas de servicio → Generar clave privada
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_started   # service_started (no service_healthy) para que el
        # backend arranque aunque pg1 esté caído y DataSourceFallback active MySQL.
      mysql:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    healthcheck:
      # La imagen eclipse-temurin no trae curl/wget; usamos bash /dev/tcp como
      # TCP probe. Es liveness, no readiness: solo verifica que el puerto este
      # aceptando conexiones (Spring puede tardar 30-60s en estar UP).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # --------------------------------------------
  # BACKEND DEV -- Spring Boot (Desarrollo)
  # Acceso vía Kong: api-dev.treepruning.org → Kong → tp-backend-dev:8080
  # --------------------------------------------
  backend-dev:
    image: ghcr.io/${GHCR_OWNER}/tree-pruning-backend:dev
    container_name: tp-backend-dev
    restart: unless-stopped
    mem_limit: 1500m
    mem_reservation: 768m
    environment:
      POSTGRES_HOST: pg1
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "true"
      JPA_FORMAT_SQL: "true"
      JPA_SCHEMA: public
      SERVER_PORT: 8080
      STORAGE_MINIO_ENDPOINT: http://tp-minio:9000
      STORAGE_MINIO_PUBLIC_ENDPOINT: https://s3.treepruning.org
      STORAGE_MINIO_BUCKET: ${STORAGE_MINIO_BUCKET}
      STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      VITE_KEYCLOAK_CLIENT: ${VITE_KEYCLOAK_CLIENT}
      STORAGE_MINIO_PRESIGNED_EXPIRY: "900"
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      STRAPI_URL: http://tp-strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      REDIS_HOST: tp-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: 1
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      # Kafka/Redpanda para listener de invalidación de caché CDC
      KAFKA_BOOTSTRAP_SERVERS: tp-redpanda:29092
      # Sin fallback a MySQL en dev: si pg1 no está disponible el entorno de
      # desarrollo simplemente no levanta. El fallback solo aplica a producción.
      DATASOURCE_FALLBACK_ENABLED: "false"
      # Firebase / FCM — JSON completo del service-account como string
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      # ─── Variaciones por entorno (las universales viven en application.properties) ───
      # Server URL publico que se incluye en el OpenAPI spec.
      # En prod NO se setea (Swagger no se expone alla via Kong).
      SERVER_PUBLIC_URL: https://api-dev.treepruning.org
      # Swagger UI publico sin token para demo y exploracion.
      # En prod NO se setea (default false) -> Swagger exige rol ADMIN.
      APP_SWAGGER_PUBLIC: "true"
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # --------------------------------------------
  # FRONTEND -- Vue/Vite servido por Nginx (Producción)
  # --------------------------------------------
  frontend:
    image: ghcr.io/${GHCR_OWNER}/treepruning-frontend:latest
    container_name: tp-frontend
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    networks:
      - treepruning-net
    environment:
      VITE_KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      VITE_KEYCLOAK_CLIENT: ${VITE_KEYCLOAK_CLIENT}
      VITE_API_URL: ${VITE_API_URL}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
      VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      VITE_STRAPI_URL: ${STRAPI_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`treepruning.org`) || Host(`www.treepruning.org`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=cloudflare"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------
  # FRONTEND DEV -- Vue/Vite (Desarrollo)
  # --------------------------------------------
  frontend-dev:
    image: ghcr.io/${GHCR_OWNER}/treepruning-frontend:dev
    container_name: tp-frontend-dev
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    networks:
      - treepruning-net
    environment:
      VITE_KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      VITE_KEYCLOAK_CLIENT: ${VITE_KEYCLOAK_CLIENT}
      VITE_API_URL: ${VITE_API_URL_DEV}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}
      VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
      VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
      VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      VITE_STRAPI_URL: ${STRAPI_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-dev.rule=Host(`dev.treepruning.org`)"
      - "traefik.http.routers.frontend-dev.entrypoints=websecure"
      - "traefik.http.routers.frontend-dev.tls.certresolver=cloudflare"
      - "traefik.http.services.frontend-dev.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  treepruning-net:
    driver: bridge


volumes:
  pg1_pgdata:
  mysql_data:
  redpanda_data:
  minio_data:
  loki_data:
  grafana_data:
  sonarqube_data:
  sonarqube_logs:
