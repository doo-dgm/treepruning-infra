services:

  # ─────────────────────────────────────────────
  # POSTGRESQL — un solo contenedor, varias DBs
  # ─────────────────────────────────────────────
  pg1:
    image: postgres:16
    container_name: pg1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - pg1_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    networks:
      - treepruning-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # ─────────────────────────────────────────────
  # REDIS — cache + sessions
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - treepruning-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # KEYCLOAK — IAM
  # ─────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tp-keycloak
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`auth.treepruning.org`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=cloudflare"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg1:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME: auth.treepruning.org
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "true"
    command: start-dev
    ports:
      - "8180:8080"
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # KONG MIGRATION (corre solo la 1ra vez)
  # ─────────────────────────────────────────────
  kong-migration:
    image: kong:3.7-ubuntu
    container_name: tp-kong-migration
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: pg1
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: ${POSTGRES_USER}
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD}
    command: kong migrations bootstrap
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_healthy
    restart: on-failure

  # ─────────────────────────────────────────────
  # KONG — API Gateway
  # ─────────────────────────────────────────────
  kong:
    image: kong:3.7-ubuntu
    container_name: tp-kong
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kong.rule=Host(`api.treepruning.org`)"
      - "traefik.http.routers.kong.entrypoints=websecure"
      - "traefik.http.routers.kong.tls.certresolver=cloudflare"
      - "traefik.http.services.kong.loadbalancer.server.port=8000"
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: pg1
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: ${POSTGRES_USER}
      KONG_PG_PASSWORD: ${POSTGRES_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - treepruning-net
    depends_on:
      - kong-migration

  # ─────────────────────────────────────────────
  # MINIO — Object storage S3-compatible
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: tp-minio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`s3.treepruning.org`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=cloudflare"
      - "traefik.http.routers.minio.service=minio-svc"
      - "traefik.http.services.minio-svc.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`console.treepruning.org`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=cloudflare"
      - "traefik.http.routers.minio-console.service=minio-console-svc"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - treepruning-net

  # ─────────────────────────────────────────────
  # SPRING CLOUD CONFIG SERVER
  # ─────────────────────────────────────────────
  config-server:
    image: hyness/spring-cloud-config-server:3.1.1-jre17
    container_name: tp-config-server
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:///config
      SPRING_PROFILES_ACTIVE: native
    ports:
      - "8888:8888"
    volumes:
      - ./docker/config-repo:/config
    networks:
      - treepruning-net

  # ─────────────────────────────────────────────
  # STRAPI — CMS
  # ─────────────────────────────────────────────
  strapi:
    image: node:20-alpine
    container_name: tp-strapi
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.strapi.rule=Host(`cms.treepruning.org`)"
      - "traefik.http.routers.strapi.entrypoints=websecure"
      - "traefik.http.routers.strapi.tls.certresolver=cloudflare"
      - "traefik.http.services.strapi.loadbalancer.server.port=1337"
    restart: unless-stopped
    working_dir: /app
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: pg1
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      APP_KEYS: ${STRAPI_APP_KEYS}
      NODE_ENV: development
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL}
    ports:
      - "1337:1337"
    volumes:
      - ./strapi-app:/app
    command: sh -c "npm run develop"
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # PROMETHEUS — metrics
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: tp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - treepruning-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  # ─────────────────────────────────────────────
  # GRAFANA — dashboards
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: tp-grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.treepruning.org`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=cloudflare"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - treepruning-net
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────
  # SONARQUBE — code quality
  # ─────────────────────────────────────────────
  sonarqube:
    image: sonarqube:10-community
    container_name: tp-sonarqube
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonar.treepruning.org`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.routers.sonarqube.tls.certresolver=cloudflare"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://pg1:5432/sonarqube
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "9010:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ─────────────────────────────────────────────
  # TRAEFIK — Reverse Proxy + SSL (Let's Encrypt)
  # ─────────────────────────────────────────────
  traefik:
    image: traefik:v2.11
    container_name: tp-traefik
    restart: unless-stopped
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/letsencrypt:/letsencrypt
    networks:
      - treepruning-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.treepruning.org`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=cloudflare"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ─────────────────────────────────────────────
  # BACKEND — Spring Boot (Producción)
  # Sin labels Traefik: acceso interno vía Kong
  #
  # Conexión a la DB ya existente en pg1:
  #   - DB:     treepruning  (ya tiene las 20 tablas creadas en schema public)
  #   - User:   postgres     (super-user, mismo que pg1)
  #   - Schema: public       (donde están las tablas reales)
  # Solo POSTGRES_PASSWORD viene de Infisical.
  #
  # JPA_DDL_AUTO=validate → asume que las tablas existen y solo valida.
  # Si en algún momento las entidades cambian, hay que aplicar la migración
  # manualmente o cambiar temporalmente a `update`.
  # ─────────────────────────────────────────────
  backend:
    image: ghcr.io/${GHCR_OWNER}/tree-pruning-backend:latest
    container_name: tp-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: pg1
      POSTGRES_DB: treepruning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
      JPA_FORMAT_SQL: "false"
      JPA_SCHEMA: public
      SERVER_PORT: 8080
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_healthy
    labels:
      - "traefik.enable=false"

  # ─────────────────────────────────────────────
  # BACKEND DEV — Spring Boot (Desarrollo)
  # Expuesto directo vía Traefik: api-dev.treepruning.org
  #
  # Misma DB que prod (treepruning, schema public).
  # JPA_DDL_AUTO=update → si una entidad nueva no tiene tabla, Hibernate la crea.
  # ─────────────────────────────────────────────
  backend-dev:
    image: ghcr.io/${GHCR_OWNER}/tree-pruning-backend:dev
    container_name: tp-backend-dev
    restart: unless-stopped
    environment:
      POSTGRES_HOST: pg1
      POSTGRES_DB: treepruning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "true"
      JPA_FORMAT_SQL: "true"
      JPA_SCHEMA: public
      SERVER_PORT: 8080
    networks:
      - treepruning-net
    depends_on:
      pg1:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-dev.rule=Host(`api-dev.treepruning.org`)"
      - "traefik.http.routers.backend-dev.entrypoints=websecure"
      - "traefik.http.routers.backend-dev.tls.certresolver=cloudflare"
      - "traefik.http.services.backend-dev.loadbalancer.server.port=8080"

  # ─────────────────────────────────────────────
  # FRONTEND — Vue/Vite servido por Nginx (Producción)
  # Expuesto vía Traefik: treepruning.org
  # ─────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GHCR_OWNER}/tree-pruning-frontend:latest
    container_name: tp-frontend
    restart: unless-stopped
    networks:
      - treepruning-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`treepruning.org`) || Host(`www.treepruning.org`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=cloudflare"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # ─────────────────────────────────────────────
  # FRONTEND DEV — Vue/Vite (Desarrollo)
  # Expuesto vía Traefik: dev.treepruning.org
  # ─────────────────────────────────────────────
  frontend-dev:
    image: ghcr.io/${GHCR_OWNER}/tree-pruning-frontend:dev
    container_name: tp-frontend-dev
    restart: unless-stopped
    networks:
      - treepruning-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-dev.rule=Host(`dev.treepruning.org`)"
      - "traefik.http.routers.frontend-dev.entrypoints=websecure"
      - "traefik.http.routers.frontend-dev.tls.certresolver=cloudflare"
      - "traefik.http.services.frontend-dev.loadbalancer.server.port=80"

networks:
  treepruning-net:
    driver: bridge

volumes:
  pg1_pgdata:
  minio_data:
  grafana_data:
  sonarqube_data:
  sonarqube_logs:
